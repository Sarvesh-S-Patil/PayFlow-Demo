<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" width="1040" height="580" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1040" height="580" fill="#ffffff"/>
  <text x="520" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">PayFlow architecture</text>

  <!-- edges (drawn first so boxes sit on top) -->
  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M240,225 L300,115"/>
    <path d="M240,255 L300,330"/>
    <path d="M500,100 L798,100"/>
    <path d="M500,322 L798,128"/>
    <path d="M400,140 L400,298"/>
    <path d="M500,340 L548,340"/>
    <path d="M730,340 L798,340"/>
    <path d="M900,300 L900,142"/>
    <path d="M860,380 Q650,450 440,382"/>
  </g>
  <g stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4" fill="none">
    <path d="M400,380 L400,470"/>
    <path d="M900,380 L900,470"/>
  </g>

  <!-- edge labels -->
  <g font-size="12.5" fill="#334155">
    <text x="210" y="160" text-anchor="middle">login, admin</text>
    <text x="215" y="310" text-anchor="middle">payments</text>
    <text x="650" y="92" text-anchor="middle">open accounts, balances (REST)</text>
    <text x="610" y="232" text-anchor="middle">balance check (REST)</text>
    <text x="410" y="225">DLT replay,</text>
    <text x="410" y="241">demo reset</text>
    <text x="890" y="216" text-anchor="end">fund transfer</text>
    <text x="890" y="232" text-anchor="end">(idempotent on clientRef)</text>
    <text x="650" y="440" text-anchor="middle">settlement report (COMPLETED / FAILED)</text>
  </g>

  <!-- boxes -->
  <g font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">
    <rect x="40" y="200" width="200" height="80" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
    <text x="140" y="236">Angular UI</text>
    <text x="140" y="256" font-size="12" font-weight="400" fill="#334155">Angular 20, nginx</text>

    <rect x="300" y="60" width="200" height="80" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="400" y="96">admin-service</text>
    <text x="400" y="116" font-size="12" font-weight="400" fill="#334155">users, roles, audit, dashboards</text>

    <rect x="300" y="300" width="200" height="80" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="400" y="330">payment-service</text>
    <text x="400" y="349" font-size="12" font-weight="400" fill="#334155">maker-checker, idempotency,</text>
    <text x="400" y="364" font-size="12" font-weight="400" fill="#334155">transactional outbox</text>

    <rect x="550" y="300" width="180" height="80" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <text x="640" y="334">Apache Kafka</text>
    <text x="640" y="354" font-size="11.5" font-weight="400" fill="#334155">payments.approved</text>
    <text x="640" y="368" font-size="11.5" font-weight="400" fill="#334155">3 partitions + DLT</text>

    <rect x="800" y="60" width="200" height="80" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="900" y="96">bank-service</text>
    <text x="900" y="116" font-size="12" font-weight="400" fill="#334155">mock bank: accounts, debits/credits</text>

    <rect x="800" y="300" width="200" height="80" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="900" y="336">ledger-service</text>
    <text x="900" y="356" font-size="12" font-weight="400" fill="#334155">Kafka consumer, postings</text>

    <rect x="300" y="470" width="700" height="80" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
    <text x="650" y="502">Oracle Database</text>
    <text x="650" y="524" font-size="12" font-weight="400" fill="#334155">one schema per service (PAYFLOW_ADMIN, _PAYMENT, _LEDGER, _BANK); read-only cross-schema views via synonyms</text>
  </g>
</svg>
